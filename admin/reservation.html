<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reservation</title>
  <link rel="icon" type="image/png" href="assets/images/Screenshot.png">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <!-- header start  -->
   <header class="header">
    <h1>THE GOLDEN SPOON</h1>
    <nav>
      <ul>
        <li><a href="./">Home</a></li>
        <li><a href="#">Menu</a></li>
        <li><a href="#">About</a></li>
        <li><a href="" class="active">Reservation</a></li>
      </ul>
    </nav>
   </header>
   <!-- header end  -->

   <!-- reservation starts  -->
    <section class="reserve">
      <h1>Reserve a table</h1>
      <p>Fields marked with * are required</p>

      <form action="#" method="post">
        <fieldset>
          <legend>Your details</legend>

          <label for="fName">Full Name *</label>
          <input type="text" id="fName" name="name" placeholder="EG. Mayowa" required>

          <label for="email">Email *</label>
          <input type="email" id="email" name="email" placeholder="EG. mayowadelu@gmail.com" required>

          <label for="phone">Phone *</label>
          <input type="text" id="phone" name="phone" placeholder="EG. +234 8118479043" required>

        </fieldset>

        <fieldset>
          <legend>Bookings detail</legend>
          
          <label for="date">Date</label>
          <input type="date" id="date" name="date" required>

          <label for="time">Time *</label>
          <input type="time" id="time" name="time" required>

          <label for="text">Number of guest</label>
          <input type="number" id="numberofguest" name="numberofguest" max="10" min="0" required>

          <label for="Seat">Seating Area</label>
          
          <select name="seat" id="Seat" required >
            <option value="No preference">No preference</option>
            <option value="Indoor">Indoor</option>
            <option value="Terrace">Terrace</option>
            <option value="bar">Bar</option>
          </select>
        </fieldset>
      </form>
    </section>
    <!-- reservation ends  -->

    <p>
      <span class="our">Our</span> story
    </p>
</body>
</html>
